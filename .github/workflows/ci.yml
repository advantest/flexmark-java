# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Every branch is built and tested. main and the release/x.y.z branches deploy their -SNAPSHOT versions to
# GitHub Packages, and a tag x.y.z on main publishes the release x.y.z; .github/scripts/check-versions.sh
# says which version may be deployed from where.

name: Java CI with Maven

on:
  push:
    branches-ignore:
    - master
    tags:
    - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os:  # see https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        - ubuntu-latest
        - macos-26-intel
        - macos-latest # ARM
        - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    
    steps:
    - name: Check out
      uses: actions/checkout@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v5 # see https://github.com/actions/setup-java
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B clean verify --file pom.xml

    - name: Upload compiled classes
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v7
      with:
        name: build-classes
        path: '**/target/classes'
        retention-days: 1

    - name: Keep the code coverage reports
      if: always() && matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage-report
        path: '**/target/site/jacoco'
        if-no-files-found: warn

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    #- name: Update dependency graph
    #  uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

  versions:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}

    steps:
    - name: Check out
      uses: actions/checkout@v6
      with:
        # The check compares the version with those of the other branches and looks for the commit on main.
        fetch-depth: 0
        filter: blob:none

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Check the version
      id: check
      run: bash .github/scripts/check-versions.sh

  deploy:
    runs-on: ubuntu-latest
    needs: [build, versions]
    if: needs.versions.outputs.deploy == 'true' && github.event_name != 'pull_request' && github.repository == 'advantest/flexmark-java'
    # Two pushes to one branch must not deploy at the same time, and a deployment is never cancelled halfway.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Check out
      uses: actions/checkout@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Download compiled classes
      uses: actions/download-artifact@v8
      with:
        name: build-classes

    - name: Deploy to GitHub Maven Packages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: mvn -B -Pdeploy-github -Dmaven.compiler.skip=true -Dmaven.test.skip=true deploy
